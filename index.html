  <!-- Full-Bleed Background Video (Mobile vs Desktop) -->
  <div class="video-bg-wrapper" aria-hidden="true">
    <video
      id="bg-video"
      class="video-bg"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
      data-src-mobile="assets/pizzas-mobile.mp4"
      data-poster-mobile="assets/pizzas-mobile-poster.jpg"
      data-src-desktop="assets/pizzas.mp4"
      data-poster-desktop="assets/pizzas-poster.jpg"
    ></video>
    <div class="video-scrim"></div>
  </div>
  <script>
    (() => {
      const video = document.getElementById('bg-video');
      if (!video) return;
      const mq = window.matchMedia('(max-width: 767px)');
      function applySource(isMobile) {
        const nextSrc = isMobile ? video.dataset.srcMobile : video.dataset.srcDesktop;
        const nextPoster = isMobile ? video.dataset.posterMobile : video.dataset.posterDesktop;
        if (video.getAttribute('src') === nextSrc) return;
        video.setAttribute('poster', nextPoster);
        video.setAttribute('src', nextSrc);
        video.load();
        video.play().catch(() => {});
      }
      applySource(mq.matches);
      mq.addEventListener('change', (e) => applySource(e.matches));
    })();
  </script>
